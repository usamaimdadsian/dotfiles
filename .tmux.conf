set-option -sg escape-time 10
set-option -g focus-events on

set-window-option -g mode-keys vi
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

set-option -a terminal-features 'XXX:RGB'
set-option -a terminal-overrides 'XXX:Tc'

bind C-v run "tmux set-buffer -- \"$(xclip -o -selection clipboard)\"; tmux display-message 'Buffer updated...'"
bind Escape copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'V' send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# Use Esc to exit copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Use i to exit copy-mode
bind -T copy-mode-vi i send-keys -X cancel

set -g status-right ""

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


unbind-key -T prefix \;
bind-key  -T prefix \; run-shell -b 'was_zoomed=$(tmux display-message -p "#{window_zoomed_flag}"); tmux last-pane; if [ "$was_zoomed" = "1" ]; then tmux resize-pane -Z; fi'

unbind-key -T copy-mode-vi \;
bind-key  -T copy-mode-vi \; run-shell -b 'was_zoomed=$(tmux display-message -p "#{window_zoomed_flag}"); tmux last-pane; if [ "$was_zoomed" = "1" ]; then tmux resize-pane -Z; fi'

unbind-key -T copy-mode \;
bind-key  -T copy-mode \; run-shell -b 'was_zoomed=$(tmux display-message -p "#{window_zoomed_flag}"); tmux last-pane; if [ "$was_zoomed" = "1" ]; then tmux resize-pane -Z; fi'


unbind h
unbind j
unbind k
unbind l

bind h if-shell -F '#{window_zoomed_flag}' 'select-pane -L -Z' 'select-pane -L'
bind j if-shell -F '#{window_zoomed_flag}' 'select-pane -D -Z' 'select-pane -D'
bind k if-shell -F '#{window_zoomed_flag}' 'select-pane -U -Z' 'select-pane -U'
bind l if-shell -F '#{window_zoomed_flag}' 'select-pane -R -Z' 'select-pane -R'
set -g extended-keys on 
set -g extended-keys-format csi-u
